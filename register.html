<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Register</title>
<style>
body{
font-family:Arial;
background:#f4f7fc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.card{
background:white;
padding:40px;
width:450px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.1);
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#2563EB;
color:white;
border:none;
border-radius:8px;
}
</style>
</head>
<body>
<div class="card">
<h2>Create Account</h2>
<input
type="text"
id="name"
placeholder="Full Name"
required
minlength="3">
<input
type="email"
id="email"
placeholder="Email Address"
required><input type="tel" placeholder="Mobile Number">
<input
type="password"
id="password"
placeholder="Password"
required
minlength="8"><input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>
Show more lines
<center>
<button onclick="goToOTP()">
Register
</button>
</center>
</div>
<script>
function goToOTP() {
window.location.href = "otp.html";
}
</script>
<script>
function goToOTP() {
const name =
document.getElementById("name").value;
const email =
document.getElementById("email").value;
const password =
document.getElementById("password").value;
const confirmPassword =
document.getElementById("confirmPassword").value;
if(name.length < 3){
alert("Enter valid name");
return;
}
if(password.length < 8){
alert("Password must be at least 8 characters");
return;
}
if(password !== confirmPassword){
alert("Passwords do not match");
return;
}
window.location.href = "otp.html";
}
</script>
</body>
</html>
